# Shared by the web and sidekiq services: one Dockerfile.dev image (built by web), the code mounted, the same DB/Redis.
# `<<:` merges shallowly, so a service that sets its own `volumes`/`environment` replaces these (web re-merges env).
x-app: &app
  image: grape_template_r8-dev
  volumes:
    - .:/rails
  environment: &app_env
    RAILS_ENV: development
    DATABASE_URL: postgres://postgres:postgres@db:5432/grape_template_r8_development
    REDIS_SIDEKIQ_URL: redis://redis:6379/1
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: >
      bash -c '
        rm -f tmp/pids/server.pid &&
        bundle exec rails db:prepare &&
        bundle exec rails s -b 0.0.0.0 -p 3000
      '
    ports:
      - "3000:3000"
    environment:
      <<: *app_env
      REDIS_CACHE_URL: redis://redis:6379/0
      REDIS_CABLE_URL: redis://redis:6379/2
    volumes:
      - .:/rails
      - /rails/tmp
  sidekiq:
    <<: *app
    command: bundle exec sidekiq
  db:
    image: postgres:16
    command: >
      postgres
        -c shared_preload_libraries=pg_stat_statements
        -c pg_stat_statements.track=all
        -c pg_stat_statements.max=10000
        -c track_activity_query_size=2048
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: grape_template_r8_development
    ports:
      - "5433:5432"
    volumes:
      - grape_template_r8_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d grape_template_r8_development"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
  redis:
    image: redis:7
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
volumes:
  grape_template_r8_pgdata:
