common: &defaults
  monitor: <%= ENV["SCOUT_KEY"].present? %>
  log_level: info
  key: <%= ENV["SCOUT_KEY"].presence %>
  name: <%= ENV["SCOUT_NAME"].presence || "GrapeTemplateR8" %>

production:
  <<: *defaults

development:
  <<: *defaults

test:
  <<: *defaults
  monitor: false

staging:
  <<: *defaults
